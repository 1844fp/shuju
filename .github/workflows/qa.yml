name: QA
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:backend:tests
      FINAGENT_ALLOW_MODEL_NETWORK: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt -r agents/requirements.txt -r infrastructure/requirements-qa.txt
      - run: mkdir -p work
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m unittest agents.test_effectiveness -v
      - run: python -m unittest discover -s infrastructure -p 'test_reliability.py' -v
      - run: python backend/test_backend.py
      - run: python -m unittest discover -s infrastructure/production -p "test_*.py" -v
      - run: node --check frontend/app.js
      - run: node --check frontend/operations.js
      - run: POSTGRES_PASSWORD=ci-only docker compose config --quiet
      - run: docker build -f infrastructure/Dockerfile.backend .
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/next/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
