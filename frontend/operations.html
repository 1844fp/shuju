<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>财务分析与治理工作台</title><link rel="stylesheet" href="/static/style.css"><body><aside><div class="brand">▥ FinAgent<small>财务数据中台</small></div><nav><a href="/">经营驾驶舱</a><a href="#analysis">分析与知识</a><a href="#finance">预算与往来</a><a href="#governance">风险与治理</a></nav><footer>单组织本机演示<br>规则分析 / 非大模型</footer></aside><main><header><span>财务分析与治理工作台</span><a href="/docs">API 文档</a></header><h1>分析、核查与追溯</h1><p class="notice">预算、应收和应付是分析台账登记，不执行付款、入账或结算。当前只支持单组织，不提供生产级权限隔离。</p><div class="filters"><label>开始 <input id="start" type="month" value="2026-01"></label><label>结束 <input id="end" type="month" value="2026-12"></label><label>币种 <select id="currency"><option>CNY</option><option>USD</option><option>EUR</option></select></label><label>核查日 <input id="asof" type="date" value="2026-11-04"></label></div><p id="message" role="status"></p><section id="analysis"><h2>分析任务与知识检索</h2><article><label>问题 <input id="question" value="分析毛利率与经营利润" style="width:65%"></label><button id="analyze">运行规则分析</button><button id="knowledge">查询知识定义</button><p>规则模式调用固定专业链，按选定期间分析；不会自由执行 SQL 或推断原因。</p><pre id="answer">尚无分析任务</pre></article></section><section id="finance"><h2>预算与应收应付台账</h2><article><p>填入独立外部编号。相同编号相同内容可重复提交，不同内容将拒绝覆盖。</p><form id="register"><div class="filters"><label>类型 <select name="kind"><option value="budget">费用预算</option><option value="receivable">应收</option><option value="payable">应付</option></select></label><label>外部编号 <input name="external_id" required maxlength="80"></label><label>期间 <input name="period" type="month" value="2026-01" required></label><label>部门编码 <input name="department" value="D01" required></label><label>金额 <input name="amount" type="number" min="0" step="0.01" required></label><label>已结算 <input name="settled" type="number" min="0" step="0.01" value="0"></label><label>交易对手 <input name="counterparty"></label><label>到期日 <input name="due_date" type="date"></label><label>来源 <select name="data_kind"><option value="uploaded">人工登记</option><option value="simulated">模拟数据</option></select></label><button>登记分析台账</button></div></form><p>预算仅与同部门、同期间、同币种的费用类凭证比较；应收应付按当前未结余额计算账龄，非历史快照。</p></article><article><button id="budget">查询预算执行</button><button id="receivable">查询应收账龄</button><button id="payable">查询应付账龄</button><div id="finance-result"></div></article></section><section id="governance"><h2>风险与治理</h2><article><div class="filters"><button id="risks">规则风险核查</button><button id="dictionary">指标与数据字典</button><button id="audit">审计记录</button></div><div id="governance-result"></div></article><article><label>批次编号 <input id="batchid" placeholder="从驾驶舱质量详情复制"></label><button id="lineage">查看血缘</button><pre id="lineage-result"></pre></article></section></main><script src="/static/operations.js"></script></body></html>
