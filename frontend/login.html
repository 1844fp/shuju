<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>登录财务数据中台</title><style>body{font:16px "Microsoft YaHei",sans-serif;background:#eef3f7;color:#18364b;margin:0}main{max-width:450px;margin:10vh auto;padding:35px;background:white}label{display:block;margin:20px 0}input{display:block;width:95%;padding:12px;margin-top:8px;border:1px solid #aac0cf}button{background:#166e83;color:white;padding:12px 24px;border:0;cursor:pointer}#message{white-space:pre-wrap}a{color:#166e83}</style><main><h1>FinAgent 登录</h1><p>组织和权限由账户决定。管理员需先在终端完成初始化。</p><form id="login"><label>用户名<input name="username" required autocomplete="username"></label><label>密码<input name="password" type="password" required autocomplete="current-password"></label><button>登录</button></form><p id="message" role="status"></p><p><a href="/">返回工作台</a></p></main><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();let msg=document.querySelector('#message');msg.textContent='登录中…';try{let r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});let v=await r.json();if(!r.ok)throw Error(v.error?.message||v.detail||'登录失败');e.target.reset();location.href='/'}catch(x){msg.textContent=x.message}finally{e.target.elements.password.value=''}};</script></html>
